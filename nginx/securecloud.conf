# ============================================================
# SecureCloud — Nginx configuration
# Web Server: Amazon Linux 2023 + Nginx (Private Subnet, sau ALB).
#
# CÀI ĐẶT TRÊN AMAZON LINUX 2023:
#   Đặt file này vào:  /etc/nginx/conf.d/securecloud.conf
#   (nginx.conf mặc định sẽ include conf.d/*.conf)
#
# SSL/TLS được terminate tại ALB nên Nginx chỉ cần listen 80.
# ALB sẽ gửi request HTTP nội bộ tới Nginx.
# ============================================================

server {

    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------- Security Headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

}
