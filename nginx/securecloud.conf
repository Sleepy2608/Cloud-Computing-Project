# ============================================================
# SecureCloud — Nginx configuration
# Web Server đặt trong Private Subnet, phía sau AWS ALB.
#
# SSL/TLS được terminate tại ALB nên Nginx chỉ cần listen 80.
# ALB sẽ gửi request HTTP nội bộ tới Nginx.
# ============================================================

server {

    listen 80;
    server_name _;

    root /var/www/securecloud;
    index index.html;

    # ---------- Security Headers ----------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ =404;
    }

}
