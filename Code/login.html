<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecureCloud - Đăng nhập</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="container">
    <div class="logo">🔐 SecureCloud</div>

    <nav>
        <a href="index.html">Trang chủ</a>
    </nav>
</header>

<main class="container">

    <section class="hero">

        <div class="badge">
            🔒 Đăng nhập an toàn
        </div>

        <h1>Đăng nhập</h1>

        <p>
            Minh họa truy cập an toàn
        </p>

    </section>

    <section class="status">

        <h2>Xác thực</h2>

        <div class="secure">
            🔒 Kết nối an toàn
        </div>

        <form id="loginForm">

            <div class="field">
                <input
                    type="text"
                    id="username"
                    placeholder="Tên đăng nhập"
                    required
                >
            </div>

            <div class="field">
                <input
                    type="password"
                    id="password"
                    placeholder="Mật khẩu"
                    required
                >
            </div>

            <button
                type="submit"
                class="btn"
            >
                Đăng nhập
            </button>

        </form>

        <p id="loginMessage"></p>

        <p class="hint">
            Tài khoản demo: admin / admin123
        </p>

    </section>

</main>

<script src="js/security.js"></script>

</body>
</html>
